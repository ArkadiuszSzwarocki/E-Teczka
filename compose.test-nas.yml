services:
  mojateczka-test:
    build:
      context: .
      dockerfile: Dockerfile.test-nas
    image: mojateczka-test:local
    container_name: mojateczka-test
    restart: unless-stopped
    env_file:
      - .env.nas
    environment:
      NODE_ENV: test
      MOJATECZKA_PUBLIC_TEST_MODE: "1"
      DATABASE_URL: "file:/app/backend/prisma/data/eteczka.db"
    volumes:
      - mojateczka_test_db:/app/backend/prisma/data
      - mojateczka_test_uploads:/app/backend/uploads
      - mojateczka_test_security:/app/backend/security
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mojateczka-test-tunnel
    restart: unless-stopped
    network_mode: "service:mojateczka-test"
    depends_on:
      - mojateczka-test
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TEST_TUNNEL_TOKEN}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mojateczka_test_db:
  mojateczka_test_uploads:
  mojateczka_test_security:
